<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo -->
  <rect width="100" height="100" fill="#000403"/>
  
  <!-- Círculo exterior - Órbita -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#19ff87" stroke-width="2" opacity="0.8"/>
  
  <!-- Círculo medio - Órbita interna -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#82ffeb" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Círculo interior - Núcleo -->
  <circle cx="50" cy="50" r="20" fill="#19ff87" opacity="0.9"/>
  
  <!-- Núcleo central - punto brillante -->
  <circle cx="50" cy="50" r="8" fill="#f5fff5" opacity="0.95"/>
  
  <!-- Puntos de acento - electrones -->
  <circle cx="75" cy="50" r="3" fill="#82ffeb" opacity="0.8"/>
  <circle cx="25" cy="50" r="3" fill="#82ffeb" opacity="0.8"/>
  <circle cx="50" cy="75" r="3" fill="#19ff87" opacity="0.8"/>
</svg>
